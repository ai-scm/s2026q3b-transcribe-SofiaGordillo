[project]
name = "spanish-audio-transcriber"
version = "0.1.0"
description = "Herramienta local para transcribir archivos MP3 y MP4 en español usando Whisper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "av==18.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

[project.scripts]
transcribir = "transcriber.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

